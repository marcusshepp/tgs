              - heading "Sandra Anger" [level=3] [ref=e73]
              - generic [ref=e74]: ★★★★★
            - paragraph [ref=e75]: 7 months ago
          - generic [ref=e76]: EXCELLENT food and service! Made our graduation party extra special. The sliders and fries got RAVE reviews from everyone. Very friendly, organized, and professional. Highly recommend.
        - generic [ref=e77]:
          - generic [ref=e78]:
            - img "Anita Rodgers's profile picture" [ref=e80]
            - generic [ref=e81]:
              - heading "Anita Rodgers" [level=3] [ref=e82]
              - generic [ref=e83]: ★★★★★
            - paragraph [ref=e84]: 8 months ago
          - generic [ref=e85]: Tim's Food truck is the best food truck ever! If you want delicious food with a variety of choices this is your company. The customer service is exceptional and to me beyond 5 stars. My annual picnic for my group of stroke survivors will definitely be memorable and Tim's Food Truck helped to make this happen. Thank you again.
        - generic [ref=e86]:
