              - generic [ref=e101]: ★★★★★
            - paragraph [ref=e102]: 9 months ago
          - generic [ref=e103]: Tim's Gourmet Sliders were in our neighborhood tonight serving up the goods! We got the Steak Burger Sliders & the Garlic Chicken Sliders served up with delicious french fries! I highly recommend!
