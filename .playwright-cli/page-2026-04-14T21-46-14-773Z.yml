        - generic [ref=e55]:
          - heading "Tim" [level=2] [ref=e56]
          - heading "Owner/Chef" [level=4] [ref=e57]
          - paragraph [ref=e58]: Tim has been a lifelong foodie with a deep-rooted passion for exceptional flavors and top-notch service. With years of experience in both fine dining and casual dining, he's honed his craft as a culinary pro, working in kitchens where quality and creativity reign supreme.
          - paragraph [ref=e59]: After traveling far and wide, tasting burgers from coast to coast, Tim noticed a gap in the food scene—there simply wasn't a slider that lived up to his gourmet standards. So, he decided to change the game.
          - paragraph [ref=e60]: "\"We chose to focus on sliders because we want to put a high-end meal in the palm of your hand. Everyone loves burgers, so we decided to put our gourmet touch and creativity on the classic slider.\""
      - generic [ref=e61]:
        - generic [ref=e63]:
          - heading "Christey" [level=2] [ref=e64]
          - heading "Event Coordinator" [level=4] [ref=e65]
          - paragraph [ref=e66]: As our dedicated Event Coordinator, Christey ensures every catering experience with Tim's Gourmet Sliders exceeds expectations. With her meticulous attention to detail and passion for creating memorable food experiences, she works closely with clients to customize menus and coordinate flawless service.
          - paragraph [ref=e67]: Christey brings warmth and professionalism to every interaction, making the planning process as enjoyable as the sliders themselves. Her expertise in event management means your gathering will run smoothly from setup to cleanup.
          - paragraph [ref=e68]: Whether you're planning a corporate function, wedding reception, or backyard celebration, Christey will help bring your vision to life with Tim's Gourmet Sliders as the highlight of your event.
        - img "Christey - Event Coordinator" [ref=e71]
      - generic [ref=e74]:
        - heading "Our Story" [level=2] [ref=e75]
        - paragraph [ref=e76]: At Tim's Gourmet Sliders, we're not just flipping patties—we're crafting an experience. Tim's vision is to deliver sliders that pack a big punch, made with the finest ingredients and a dash of flair, all served with the kind of care you'd expect from a seasoned pro.
        - paragraph [ref=e77]: Our team is dedicated, responsible, and downright excited to bring you sliders that elevate the everyday into something extraordinary. We're here to make your day delicious—one gourmet bite at a time!
      - img "Tim's Gourmet Sliders Food Truck" [ref=e81]
