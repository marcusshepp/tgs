[build]
  command = "npm run build"
  publish = "dist/tgs/browser"
  functions = "netlify/functions"

# Skip Angular SSR - use prerendered static pages only
# The @netlify/angular-runtime plugin has compatibility issues with Angular 19
[build.environment]
  NETLIFY_SKIP_ANGULAR_RUNTIME = "true"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "POST, OPTIONS"
