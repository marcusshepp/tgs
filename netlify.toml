[build]
  command = "npm run build"
  publish = "dist/tgs/browser"
  functions = "netlify/functions"
  # Ignore the edge functions directory that angular-runtime tries to create
  ignore_edge_functions = true

# Skip Angular SSR - use prerendered static pages only
# IMPORTANT: You must also remove @netlify/angular-runtime from Netlify UI:
# Site Settings > Build & deploy > Build plugins > Remove the Angular plugin
[build.environment]
  NETLIFY_SKIP_ANGULAR_RUNTIME = "true"

# Explicitly disable the Angular plugin
[[plugins]]
  package = "@netlify/angular-runtime"
  [plugins.inputs]
    skip = true

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Allow-Methods = "POST, OPTIONS"
