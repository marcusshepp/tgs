<section class="meet-us-section" *ngIf="meetUs">
    <div class="container">
        <app-page-title [title]="meetUs.title"></app-page-title>

        <ng-container *ngFor="let member of meetUs.teamMembers; let i = index">
            <!-- Even index: image left, text right -->
            <div class="row align-items-center mb-5" *ngIf="i % 2 === 0">
                <div class="col-lg-6">
                    <div class="team-member-image">
                        <img
                            [src]="member.photoUrl"
                            [alt]="member.photoAlt"
                            class="img-fluid rounded"
                        />
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="team-member-info">
                        <h2 class="mb-3">{{ member.name }}</h2>
                        <h4 class="mb-4">{{ member.role }}</h4>
                        <p *ngFor="let para of getBioParagraphs(member.bio)">{{ para }}</p>
                    </div>
                </div>
            </div>

            <!-- Odd index: text left, image right -->
            <div class="row align-items-center mb-5" *ngIf="i % 2 !== 0">
                <div class="col-lg-6">
                    <div class="team-member-info">
                        <h2 class="mb-3">{{ member.name }}</h2>
                        <h4 class="mb-4">{{ member.role }}</h4>
                        <p *ngFor="let para of getBioParagraphs(member.bio)">{{ para }}</p>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="team-member-image">
                        <img
                            [src]="member.photoUrl"
                            [alt]="member.photoAlt"
                            class="img-fluid rounded"
                        />
                    </div>
                </div>
            </div>
        </ng-container>

        <div class="row justify-content-center mb-5">
            <div class="col-lg-8 text-center">
                <div class="our-story">
                    <h2 class="mb-4">{{ meetUs.storyHeading }}</h2>
                    <p *ngFor="let para of getStoryParagraphs()">{{ para }}</p>
                </div>
            </div>
        </div>

        <div class="row mb-5">
            <div class="col-12">
                <div class="food-truck-showcase">
                    <img
                        [src]="meetUs.imageUrl"
                        alt="Tim's Gourmet Sliders Food Truck"
                        class="img-fluid rounded"
                    />
                </div>
            </div>
        </div>
    </div>
</section>
