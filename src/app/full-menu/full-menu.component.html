<app-banner variant="full-menu" title="Menu"></app-banner>

<section class="menu-showcase section-padding">
    <div class="container">
        <div class="row mb-5">
            <div class="title-area">
                <div class="sub-title text-center">
                    <img
                        class="title-icon me-1"
                        src="/img/icon/titleIcon.svg"
                        alt="icon"
                    />
                    <span class="title-text">DETROITS BEST SLIDER MENU</span>
                    <img
                        class="title-icon ms-1"
                        src="/img/icon/titleIcon.svg"
                        alt="icon"
                    />
                </div>
            </div>
        </div>

        <div class="menu-grid">
            <div
                *ngFor="let item of menu; let $index = index"
                class="menu-card"
                [attr.data-index]="$index"
                @fadeIn
            >
                <div class="card shadow-sm h-100">
                    <div class="menu-image-wrapper">
                        <img
                            [src]="item.imageUrl || '/img/menu/default.png'"
                            [alt]="item.title"
                            class="menu-image"
                            loading="lazy"
                        />
                    </div>
                    <div class="card-body">
                        <h3 class="card-title">{{item.title}}</h3>
                        <p class="card-text">{{item.description}}</p>
                    </div>
                    <div class="card-footer">
                        <div class="btn-wrapper">
                            <a
                                class="theme-btn"
                                [routerLink]="['/menu-item', item.id]"
                            >
                                View Details
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="16"
                                    height="16"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                >
                                    <path d="M5 12h14"></path>
                                    <path d="M12 5l7 7-7 7"></path>
                                </svg>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
