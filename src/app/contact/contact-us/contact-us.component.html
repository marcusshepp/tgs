<section class="contact-page">
    <div class="container">
        <div class="contact-grid">
            <!-- Form Section - First on mobile -->
            <div class="contact-form-section">
                <app-contact-form></app-contact-form>

                <!-- Mobile-only image -->
                <div class="info-image-mobile">
                    <img
                        [src]="contact.sideImageUrl || 'https://cdn.syncgr.com/domains/timsgourmetsliders.com/d11ba089-59a5-4b3c-8fe2-29ca6b257716.webp'"
                        alt="Tim's Gourmet Sliders Food Truck"
                        loading="lazy"
                    />
                </div>
            </div>

            <!-- Info Section -->
            <div class="contact-info-section">
                <div class="info-image">
                    <img
                        [src]="contact.sideImageUrl || 'https://cdn.syncgr.com/domains/timsgourmetsliders.com/d11ba089-59a5-4b3c-8fe2-29ca6b257716.webp'"
                        alt="Tim's Gourmet Sliders Food Truck"
                        loading="lazy"
                    />
                </div>

                <div class="info-card">
                    <h2>{{ contact.sectionHeading }}</h2>

                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>
                        <div class="info-content">
                            <h3>Service Area</h3>
                            <p>{{ contact.serviceArea }}</p>
                            <span class="info-note">{{ contact.serviceAreaNote }}</span>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fa-solid fa-phone"></i>
                        </div>
                        <div class="info-content">
                            <h3>Call Us</h3>
                            <a [href]="contact.phoneLink">{{ contact.phone }}</a>
                            <span class="info-note">{{ contact.responseTime }}</span>
                        </div>
                    </div>

                    <div class="info-item">
                        <div class="info-icon">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <div class="info-content">
                            <h3>Email</h3>
                            <a [href]="'mailto:' + contact.email">{{ contact.email }}</a>
                        </div>
                    </div>
                </div>

                <div class="info-card rules-card">
                    <h3>Good to Know</h3>
                    <ul class="rules-list">
                        <li *ngFor="let item of contact.goodToKnow; let i = index">
                            <span class="rule-number">{{ (i + 1).toString().padStart(2, '0') }}</span>
                            <span>{{ item.text }}</span>
                        </li>
                    </ul>
                </div>

                <a routerLink="/menu" class="menu-link">
                    <span>View Our Full Menu</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </a>
            </div>
        </div>
    </div>
</section>
