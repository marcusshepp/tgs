<section class="hero-section" #heroSection>
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <div class="hero-title-container">
            <div class="hero-title">
                <div class="title-line">Tims</div>
                <div class="title-line">Gourmet</div>
                <div class="title-line">Sliders</div>
                <div class="title-line">Food Truck</div>
            </div>
        </div>
        <div class="hero-burger">
            <img
                src="/img/new/whiskey.jpg"
                alt="Delicious gourmet slider"
                class="burger-image"
                loading="eager"
                decoding="async"
            />
        </div>
        <div class="cta-container">
            <a routerLink="menu" class="cta-button">View Our Menu</a>
            <a [href]="contact.PHONE_LINK" class="cta-button cta-secondary"
                >Call Now</a
            >
        </div>
    </div>
    <div class="hero-bottom" #heroBottom>
        <div class="container-fluid">
            <div class="info-bar">
                <div class="location-info">
                    <i class="fa-solid fa-location-dot"></i>
                    <span>{{ contact.ADDRESS }}</span>
                    <a [href]="contact.PHONE_LINK" class="phone-link">
                        {{ contact.PHONE }}
                    </a>
                </div>
                <div class="social-info">
                    <p>Follow Us:</p>
                    <div class="social-icons">
                        <a target="_blank" [href]="socials.FACEBOOK"
                            ><i class="fab fa-facebook-f"></i
                        ></a>
                        <a target="_blank" [href]="socials.GOOGLE"
                            ><i class="fab fa-google"></i
                        ></a>
                        <a target="_blank" [href]="socials.INSTAGRAM"
                            ><i class="fab fa-instagram"></i
                        ></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
