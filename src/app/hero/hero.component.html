<section class="banner-section fix">
    <div class="slider-area">
        <div class="swiper banner3-slider">
            <div class="swiper-wrapper">
                <div class="swiper-slide">
                    <div class="banner-wrapper style3 bg-img">
                        <div
                            class="shape1 d-none d-xxl-block"
                            data-animation="slideInLeft"
                            data-duration="2s"
                            data-delay=".3s"
                        >
                            <img
                                class="float-bob-y"
                                src="/img/shape/burger-shape.png"
                                alt="shape"
                            />
                        </div>
                        <div
                            class="shape2 d-none d-xxl-block"
                            data-animation="slideInLeft"
                            data-duration="2s"
                            data-delay=".5s"
                        >
                            <img
                                class="float-bob-x"
                                src="/img/shape/burger-shape.png"
                                alt="shape"
                            />
                        </div>
                        <div class="shape2"></div>
                        <div class="overlay"></div>
                        <div class="container">
                            <div class="row">
                                <div class="col-12">
                                    <div class="banner-style3">
                                        <div
                                            class="subtitle"
                                            data-animation="slideInRight"
                                            data-duration="2s"
                                            data-delay=".3s"
                                        >
                                            Tim's
                                        </div>
                                        <div
                                            class="subtitle"
                                            data-animation="slideInLeft"
                                            data-duration="2s"
                                            data-delay=".3s"
                                        >
                                            Gourmet
                                        </div>
                                        <div
                                            class="subtitle"
                                            data-animation="slideInRight"
                                            data-duration="2s"
                                            data-delay=".3s"
                                        >
                                            sliders
                                        </div>
                                        <p
                                            class="hero-text"
                                            data-animation="slideInLeft"
                                            data-duration="2s"
                                            data-delay=".9s"
                                        ></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="banner-bottom z-3 position-relative">
                            <div
                                class="container-fluid d-flex align-items-center justify-content-between"
                            >
                                <div class="fancy-item">
                                    <div>
                                        <i
                                            class="fa-solid fa-location-dot text-theme-color2"
                                        ></i>
                                        <span class="text-white"
                                            >{{ contact.ADDRESS }}</span
                                        >
                                    </div>
                                    <div
                                        itemscope
                                        itemtype="http://schema.org/LocalBusiness"
                                    >
                                        <p>
                                            <a
                                                [href]="contact.PHONE_LINK"
                                                itemprop="telephone"
                                                aria-label="Call our business at 555-555-5555"
                                                class="text-white"
                                            >
                                                {{ contact.PHONE }}
                                            </a>
                                        </p>
                                    </div>
                                </div>
                                <div
                                    class="social-meta d-flex flex-column flex-md-row align-items-center gap-2"
                                >
                                    <p class="text-white">Follow Us:</p>
                                    <ul class="d-flex align-items-center gap-2">
                                        <a
                                            target="_blank"
                                            [href]="socials.FACEBOOK"
                                            ><i class="fab fa-facebook-f"></i
                                        ></a>
                                        <a target="_blank" [href]="socials.YELP"
                                            ><i class="fab fa-yelp"></i
                                        ></a>
                                        <a
                                            target="_blank"
                                            [href]="socials.GOOGLE"
                                            ><i class="fab fa-google"></i
                                        ></a>
                                        <a
                                            target="_blank"
                                            [href]="socials.INSTAGRAM"
                                            ><i class="fab fa-instagram"></i
                                        ></a>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
