<section class="hero" [attr.aria-label]="brand?.ariaDescription || 'Tim\'s Gourmet Sliders - Detroit & Redford Michigan Food Truck'">
    <!-- Video Background -->
    <div class="hero__background">
        <div class="hero__loader" [class.hero__loader--hidden]="videoLoaded">
            <div class="hero__spinner"></div>
        </div>
        <video
            class="hero__video"
            [class.hero__video--visible]="videoLoaded"
            autoplay
            muted
            loop
            playsinline
            [muted]="true"
            preload="metadata"
            [attr.poster]="brand?.heroVideoPoster || 'https://cdn.syncgr.com/domains/timsgourmetsliders.com/c648dc4b-d724-45c6-b7d1-036083222e12.jpg'"
            (canplaythrough)="onVideoReady()"
            (playing)="onVideoReady()"
            #heroVideo
        >
            <source [attr.src]="brand?.heroVideoMp4 || 'https://cdn.syncgr.com/domains/timsgourmetsliders.com/568957c5-d038-4a81-85df-15474a8052d4.mp4'" type="video/mp4" />
        </video>
        <div class="hero__overlay"></div>
    </div>

    <!-- Hero Content -->
    <div class="hero__container">
        <header class="hero__header">
            <h1 class="hero__title">{{ brand?.businessName || "Tim's Gourmet Sliders" }}</h1>
            <p class="hero__tagline">{{ brand?.tagline || "Detroit's #1 Top Rated Food Truck" }}</p>
        </header>

        <a [routerLink]="hero?.ctaUrl || '/menu'" class="hero__cta">{{ hero?.ctaLabel || 'View Our Menu' }}</a>

        <!-- Contact Info -->
        <footer class="hero__contact" *ngIf="contact">
            <a [href]="contact.phoneLink" class="hero__contact-item">
                <i class="fa-solid fa-phone"></i>
                <span>{{ contact.phone }}</span>
            </a>
            <div class="hero__contact-divider"></div>
            <div class="hero__contact-item">
                <i class="fa-solid fa-location-dot"></i>
                <span>{{ contact.address }}</span>
            </div>
            <div class="hero__contact-divider"></div>
            <div class="hero__social" *ngIf="brand">
                <a [href]="brand.socialUrls.facebook" target="_blank" rel="noopener" aria-label="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a [href]="brand.socialUrls.instagram" target="_blank" rel="noopener" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a [href]="brand.socialUrls.google" target="_blank" rel="noopener" aria-label="Google">
                    <i class="fab fa-google"></i>
                </a>
            </div>
        </footer>

        <div class="hero__halal-badge" *ngIf="brand">
            <span>{{ brand.halalBadgeText }}</span>
        </div>
    </div>
</section>
