<div
    class="mobile-menu"
    [class.active]="isOpen"
    (click)="onBackdropClick($event)"
>
    <div class="mobile-menu__panel">
        <div class="mobile-menu__header">
            <a routerLink="/" class="mobile-menu__logo">
                <img
                    src="/img/old/logo.png"
                    alt="Logo"
                    width="100"
                    height="46"
                />
            </a>
            <button class="mobile-menu__close" (click)="closeMenu()">
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 320 512"
                    width="24"
                    height="24"
                >
                    <path
                        d="M310.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L160 210.7 54.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L114.7 256 9.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 301.3 265.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L205.3 256 310.6 150.6z"
                    />
                </svg>
            </button>
        </div>

        <nav class="mobile-menu__nav">
            <ul class="mobile-menu__list">
                <li><a routerLink="/" (click)="closeMenu()">Home</a></li>
                <li>
                    <a routerLink="catering" (click)="closeMenu()">Catering</a>
                </li>
                <li><a routerLink="menu" (click)="closeMenu()">Menu</a></li>
                <li>
                    <a routerLink="meet-us" (click)="closeMenu()">Meet Us</a>
                </li>
                <li><a routerLink="/" (click)="closeMenu()">Reviews</a></li>
                <li>
                    <a routerLink="contact-us" (click)="closeMenu()"
                        >Contact Us</a
                    >
                </li>
            </ul>
        </nav>

        <div class="mobile-menu__order">
            <a
                routerLink="menu"
                class="mobile-menu__order-btn"
                (click)="closeMenu()"
            >
                Order Now
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 448 512"
                    width="16"
                    height="16"
                >
                    <path
                        d="M438.6 278.6c12.5-12.5 12.5-32.8 0-45.3l-160-160c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L338.8 224 32 224c-17.7 0-32 14.3-32 32s14.3 32 32 32l306.7 0L233.4 393.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0l160-160z"
                    />
                </svg>
            </a>
        </div>

        <div class="mobile-menu__social">
            <a
                href="{{ socials.FACEBOOK }}"
                target="_blank"
                rel="noopener noreferrer"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 320 512"
                    width="20"
                    height="20"
                >
                    <path
                        d="M279.14 288l14.22-92.66h-88.91v-60.13c0-25.35 12.42-50.06 52.24-50.06h40.42V6.26S260.43 0 225.36 0c-73.22 0-121.08 44.38-121.08 124.72v70.62H22.89V288h81.39v224h100.17V288z"
                    />
                </svg>
            </a>
            <a
                href="{{ socials.INSTAGRAM }}"
                target="_blank"
                rel="noopener noreferrer"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 448 512"
                    width="20"
                    height="20"
                >
                    <path

                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 488 512"
                    width="20"
                    height="20"
                >
                    <path
                        d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"

                </svg>
            </a>
        </div>
    </div>
</div>
